<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Habit Tracker</h1>
        <p class="subtitle">Build consistency one day at a time.</p>
      </header>

      <section class="panel add-habit-panel">
        <h2>Add Daily Habit</h2>
        <form id="habit-form" class="habit-form">
          <input
            id="habit-input"
            type="text"
            placeholder="e.g. Drink 2L water"
            maxlength="60"
            required
          />
          <button type="submit">Add</button>
        </form>
      </section>

      <section class="panel tracker-panel">
        <div class="tracker-header">
          <h2>Today's Habits</h2>
          <p id="selected-date-label" class="selected-date-label"></p>
        </div>
        <ul id="habit-list" class="habit-list"></ul>
        <p id="empty-state" class="empty-state">No habits yet. Add your first one above.</p>
      </section>

      <section class="panel calendar-panel">
        <div class="calendar-header">
          <button id="prev-month" aria-label="Previous month">←</button>
          <h2 id="calendar-title"></h2>
          <button id="next-month" aria-label="Next month">→</button>
        </div>
        <div class="calendar-weekdays">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </section>
    </main>

    <template id="habit-item-template">
      <li class="habit-item">
        <div>
          <p class="habit-name"></p>
          <p class="habit-meta"></p>
        </div>
        <div class="habit-actions">
          <label class="checkbox-wrap">
            <input type="checkbox" class="habit-checkbox" />
            <span>Done</span>
          </label>
          <button class="delete-btn" aria-label="Delete habit">Delete</button>
        </div>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
