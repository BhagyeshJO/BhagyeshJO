<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A minimal, local-first habit tracking app with streaks and calendar view."
    />
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <main class="app" aria-live="polite">
      <header class="app__header">
        <h1>Habit Tracker</h1>
        <p class="app__subtitle">Build consistency one day at a time.</p>
      </header>

      <section class="panel" aria-labelledby="add-habit-title">
        <h2 id="add-habit-title">Add Daily Habit</h2>
        <form id="habit-form" class="habit-form" autocomplete="off">
          <label class="sr-only" for="habit-input">Habit name</label>
          <input
            id="habit-input"
            name="habit"
            type="text"
            maxlength="60"
            placeholder="e.g. Drink 2L water"
            required
          />
          <button type="submit">Add</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="today-title">
        <div class="tracker-header">
          <h2 id="today-title">Habits</h2>
          <p id="selected-date-label" class="selected-date-label"></p>
        </div>

        <ul id="habit-list" class="habit-list" aria-label="Habit list"></ul>
        <p id="empty-state" class="empty-state">No habits yet. Add your first one above.</p>
      </section>

      <section class="panel" aria-labelledby="calendar-title">
        <div class="calendar-header">
          <button id="prev-month" type="button" aria-label="Previous month">←</button>
          <h2 id="calendar-title"></h2>
          <button id="next-month" type="button" aria-label="Next month">→</button>
        </div>

        <div class="calendar-weekdays" aria-hidden="true">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="Calendar"></div>
      </section>
    </main>

    <template id="habit-item-template">
      <li class="habit-item">
        <div>
          <p class="habit-item__name"></p>
          <p class="habit-item__meta"></p>
        </div>
        <div class="habit-item__actions">
          <label class="checkbox-wrap">
            <input type="checkbox" class="habit-item__checkbox" />
            <span>Done</span>
          </label>
          <button class="danger-btn" type="button" aria-label="Delete habit">Delete</button>
        </div>
      </li>
    </template>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
